<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Switch - Scheduled Job Manager</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Load cronstrue library for human-readable CRON descriptions -->
    <script src="https://cdn.jsdelivr.net/npm/cronstrue@latest/dist/cronstrue.min.js"></script>
    <!-- CodeMirror (v5) for script editor: dark theme + line numbers -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/darcula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <!-- Shell mode for bash/sh highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/shell/shell.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/dark-mode-overrides.css">
    <link rel="icon" href="/static/favicon.png">
</head>

<body class="antialiased">

    <!-- Main Application Container -->
    <div id="app" class="flex flex-col items-center main-container">

        <!-- Header - Made it sticky and added a distinct shadow/color -->
        <header id="header-bar"
            class="w-full fixed top-0 bg-white dark:bg-slate-800 shadow-lg z-30 transition-colors duration-300">
            <div
                class="max-w-7xl mx-auto flex justify-between items-center px-4 sm:px-8 py-3 border-b border-gray-100 dark:border-gray-700">
                <h1
                    class="text-2xl font-extrabold text-indigo-700 dark:text-indigo-400 tracking-tight flex items-center">
                    <img src="/static/favicon.png" alt="Switch" class="h-8 w-8 mr-2"> The Switch
                    <span
                        class="hidden sm:inline text-xs ml-4 px-2 py-0.5 bg-indigo-50 dark:bg-indigo-900 text-indigo-600 dark:text-indigo-300 rounded-full font-medium">Job
                        Manager</span>
                </h1>
                <button id="logout-button"
                    class="hidden px-4 py-2 bg-red-500 text-white font-semibold rounded-lg shadow-lg hover:bg-red-600 transition duration-150"
                    onclick="handleLogout()">
                    Logout
                </button>
            </div>
        </header>

        <!-- Dynamic Content Area (Offset for sticky header) -->
        <main id="content-area" class="w-full max-w-7xl flex justify-center items-start pt-24 pb-8 px-4 sm:px-8"></main>

    </div>

    <!-- Execution History Modal (Hidden by default) -->
    <div id="history-modal"
        class="hidden fixed inset-0 z-50 overflow-y-auto modal-overlay flex items-center justify-center"
        onclick="if (event.target === this) closeHistoryModal()">
        <div
            class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-4xl m-4 modal-content transform translate-y-0 opacity-100 transition-colors duration-300">
            <!-- Modal Header -->
            <div
                class="p-6 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-indigo-50 dark:bg-indigo-900 rounded-t-2xl">
                <h3 id="history-modal-title" class="text-xl font-extrabold text-indigo-700 dark:text-indigo-300">
                    Execution History</h3>
                <button onclick="closeHistoryModal()"
                    class="p-2 rounded-full text-indigo-500 dark:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-800 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="w-5 h-5">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>

            <!-- Modal Body -->
            <div id="history-modal-body" class="p-6">
                <!-- Content will be injected here -->
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-gray-100 dark:border-gray-700 flex justify-end">
                <button onclick="closeHistoryModal()"
                    class="px-6 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-semibold rounded-xl hover:bg-gray-300 dark:hover:bg-gray-600 transition duration-150">
                    Close
                </button>
            </div>
        </div>
    </div>


    <script src="/static/script.js"></script>

    <!-- Footer with build info -->
    <footer
        class="w-full bg-white dark:bg-slate-800 border-t border-gray-100 dark:border-gray-700 mt-8 transition-colors duration-300">
        <div
            class="max-w-7xl mx-auto px-4 sm:px-8 py-3 text-sm text-gray-500 dark:text-gray-400 flex justify-between items-center flex-wrap gap-3">
            <div class="text-xs text-gray-400 dark:text-gray-500">© TheSwitch</div>
            <div class="flex space-x-4 items-center flex-wrap gap-3">
                <div class="text-xs text-gray-600 dark:text-gray-400">Version: <span id="build-version"
                        class="font-mono text-sm">dev</span></div>
                <div class="text-xs text-gray-600 dark:text-gray-400">Revision: <span id="build-revision"
                        class="font-mono text-sm">none</span></div>
                <div class="text-xs text-gray-600 dark:text-gray-400">Built: <span id="build-time"
                        class="font-mono text-sm">unknown</span>
                </div>
                <!-- Theme Toggle -->
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-gray-600 dark:text-gray-400">Theme:</span>
                    <button id="theme-toggle" class="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
                        <div class="theme-toggle-slider">
                            <svg id="theme-icon" class="theme-icon" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <!-- Sun icon (default) -->
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                                </path>
                            </svg>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </footer>

</body>

</html>
